apiVersion: v1
kind: Secret
metadata:
  name: pialoa-mysql-secret
type: Opaque
data:
  # echo -n 'secret' | base64
  password: c2VjcmV0
  # echo -n 'secret' | base64
  root-password: c2VjcmV0
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pialoa-app-config
data:
  APP_NAME: Laravel
  APP_ENV: local
  APP_KEY: ""
  APP_DEBUG: "true"
  APP_URL: http://localhost
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  APP_FAKER_LOCALE: en_US
  APP_MAINTENANCE_DRIVER: file
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: stack
  LOG_STACK: single
  LOG_DEPRECATIONS_CHANNEL: null
  LOG_LEVEL: debug
  # Database settings (will be overridden by secret if needed, but we keep for completeness)
  DB_CONNECTION: mysql
  DB_HOST: pialoa-mysql
  DB_PORT: "3306"
  DB_DATABASE: pialoatech
  DB_USERNAME: laravel
  # DB_PASSWORD: from secret
  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: /
  SESSION_DOMAIN: null
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  MEMCACHED_HOST: 127.0.0.1
  REDIS_CLIENT: phpredis
  REDIS_HOST: 127.0.0.1
  REDIS_PASSWORD: null
  REDIS_PORT: "6379"
  MAIL_MAILER: log
  MAIL_SCHEME: null
  MAIL_HOST: 127.0.0.1
  MAIL_PORT: "2525"
  MAIL_USERNAME: null
  MAIL_PASSWORD: null
  MAIL_FROM_ADDRESS: "hello@example.com"
  MAIL_FROM_NAME: "${APP_NAME}"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: ""
  AWS_USE_PATH_STYLE_ENDPOINT: "false"
  VITE_APP_NAME: "${APP_NAME}"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pialoa-mysql
spec:
  serviceName: "pialoa-mysql"
  replicas: 1
  selector:
    matchLabels:
      app: pialoa-mysql
  template:
    metadata:
      labels:
        app: pialoa-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: "pialoatech"
            - name: MYSQL_USER
              value: "laravel"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pialoa-mysql-secret
                  key: password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pialoa-mysql-secret
                  key: root-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pialoa-mysql
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: pialoa-mysql
  clusterIP: None  # Headless service for StatefulSet