version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"   # Laravel development server
      - "5173:5173"   # Vite development server
    volumes:
      - ./:/var/www:cached
      - /var/www/vendor  # Exclure vendor du montage
      - /var/www/node_modules  # Exclure node_modules du montage
    depends_on:
      - db
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=pialoatech
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
      - VITE_HOST=0.0.0.0
      - WATCHPOLL_POLLING=true
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - laravel-network

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: pialoatech
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - laravel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  db_data:

networks:
  laravel-network:
    driver: bridge